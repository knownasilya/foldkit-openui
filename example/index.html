<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>foldkit-openui example</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
      }
      .pane {
        padding: 1.5rem;
        overflow: auto;
      }
      .pane + .pane {
        border-left: 1px solid light-dark(#ddd, #333);
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.75rem;
      }
      textarea {
        width: 100%;
        height: 60vh;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        padding: 0.75rem;
      }
      .card {
        border: 1px solid light-dark(#ddd, #333);
        border-radius: 8px;
        padding: 1rem;
        margin: 0.5rem 0;
      }
      .log {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        white-space: pre-wrap;
        background: light-dark(#f5f5f5, #1a1a1a);
        padding: 0.5rem;
        border-radius: 6px;
        margin-top: 1rem;
        max-height: 20vh;
        overflow: auto;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
